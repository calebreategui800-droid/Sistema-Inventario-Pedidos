spring.application.name=inventariopedidos

# ---- Base de datos PostgreSQL ----
# Los valores por defecto sirven para una instalacion local tipica.
# Para usar otra clave NO la escribas aqui (no se sube a Git): define variables de entorno
# DB_USER, DB_PASSWORD, DB_NAME antes de arrancar.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:inventariopedidos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update = crea/ajusta las tablas solas y conserva los datos entre reinicios
# create = borra y recrea las tablas en cada arranque (util para dejar la demo "limpia")
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
server.port=8081

# Clave secreta para firmar tokens JWT
jwt.secret=${JWT_SECRET}